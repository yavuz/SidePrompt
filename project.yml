name: SidePrompt
options:
  bundleIdPrefix: com.sideprompt
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  SidePrompt:
    type: application
    platform: macOS
    sources:
      - path: SidePrompt
        excludes:
          - Resources/AppIcon-1024.png
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sideprompt.app
        PRODUCT_NAME: SidePrompt
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: SidePrompt/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SidePrompt/Resources/SidePrompt.entitlements
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        # Set your Team ID in Xcode → Signing & Capabilities (or DEVELOPMENT_TEAM=… when building).
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: SidePrompt/Resources/SidePrompt.entitlements
